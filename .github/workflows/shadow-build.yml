name: Encrypted Boss Room shadow build
run-name: Shadow build ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Public run correlation ID
        type: string
        required: true
      request:
        description: Approved encrypted diffs, public bases, and output recipient
        type: string
        required: true

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  request:
    if: >-
      github.repository == 'haiven-dev/haiven-sdk-unity-bossroom' && github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main' && github.ref_protected && github.run_attempt == '1'
      && vars.SDK_SHADOW_DISPATCH_ACTOR_ID != '' && github.actor_id == vars.SDK_SHADOW_DISPATCH_ACTOR_ID
    runs-on: ubuntu-24.04
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      request_id: ${{ steps.plan.outputs.request_id }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Require a pinned shared builder
        env:
          BUILDER_SHA: ${{ vars.SDK_SHADOW_BUILDER_SHA }}
        shell: bash
        run: '[[ "$BUILDER_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: haiven-dev/haiven-sdk-cpp
          ref: ${{ vars.SDK_SHADOW_BUILDER_SHA }}
          path: builder
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - id: plan
        name: Validate the request for Boss Room
        env:
          EXPECTED_TARGET: 'bossroom'
          SHADOW_REQUEST: ${{ inputs.request }}
          DISPLAY_ID: ${{ inputs.request_id }}
        shell: bash
        run: |
          [[ "$DISPLAY_ID" == "$(jq -r .request_id <<< "$SHADOW_REQUEST")" ]]
          python builder/.github/shadow-build/build.py plan

  build:
    # Every Boss Room player cross-builds on Linux in its Unity build module's image.
    name: Shadow build / ${{ matrix.platform }}
    needs: request
    environment: shadow-source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.request.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: haiven-dev/haiven-sdk-cpp
          ref: ${{ vars.SDK_SHADOW_BUILDER_SHA }}
          path: builder
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.request.outputs.base_sha }}
          path: source
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install pinned age
        shell: bash
        run: go install filippo.io/age/cmd/age@v1.3.2
      - name: Verify and reconstruct approved source
        env:
          SHADOW_REQUEST: ${{ inputs.request }}
          SDK_SHADOW_SOURCE_AGE_IDENTITY: ${{ secrets.SDK_SHADOW_SOURCE_AGE_IDENTITY }}
        shell: bash
        run: |
          go_bin="$(go env GOPATH)/bin"
          export PATH="$go_bin:$PATH"
          python builder/.github/shadow-build/build.py reconstruct --source source \
            --dotnet source --verification "$RUNNER_TEMP/shadow-source.json"
      - name: Fetch the approved Boss Room assets already published here
        working-directory: source
        shell: bash
        run: git lfs pull
      - name: Start the pinned Unity editor and activate its licence
        env:
          IMAGE: ${{ matrix.image }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: bash
        run: |
          [[ "$IMAGE" =~ ^unityci/editor:ubuntu-[0-9a-z.]+-[a-z0-9-]+@sha256:[0-9a-f]{64}$ ]]
          docker run --detach --name haiven-unity --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --entrypoint sleep "$IMAGE" infinity >/dev/null
          # Activation logs can name the account, so they stay inside the container.
          if [[ -n "$UNITY_SERIAL" ]]; then
            docker exec --env UNITY_EMAIL --env UNITY_PASSWORD --env UNITY_SERIAL haiven-unity sh -c \
              'unity-editor -batchmode -nographics -quit -logFile /tmp/activate.log \
                -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"' \
              || { echo "Unity serial activation failed." >&2; exit 1; }
          elif [[ -n "$UNITY_LICENSE" ]]; then
            printf '%s' "$UNITY_LICENSE" | docker exec --interactive haiven-unity sh -c \
              'cat > /tmp/Unity_lic.ulf && unity-editor -batchmode -nographics -quit \
                -logFile /tmp/activate.log -manualLicenseFile /tmp/Unity_lic.ulf; rm -f /tmp/Unity_lic.ulf' \
              || { echo "Unity licence file activation failed." >&2; exit 1; }
          else
            echo "Set UNITY_LICENSE or UNITY_SERIAL in the shadow-source environment." >&2
            exit 1
          fi
          launcher="$RUNNER_TEMP/unity-editor/unity"
          mkdir -p "$(dirname "$launcher")"
          # shellcheck disable=SC2016 # $PWD and $@ expand when the launcher runs.
          printf '#!/bin/sh\nexec docker exec --workdir "$PWD" haiven-unity unity-editor "$@"\n' > "$launcher"
          chmod +x "$launcher"
          printf 'UNITY_EDITOR=%s\n' "$launcher" >> "$GITHUB_ENV"
      - id: build
        name: Build and seal results
        env:
          SHADOW_REQUEST: ${{ inputs.request }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          go_bin="$(go env GOPATH)/bin"
          export PATH="$go_bin:$PATH"
          python builder/.github/shadow-build/build.py build --platform "$PLATFORM" --source source \
            --dotnet source --verification "$RUNNER_TEMP/shadow-source.json" \
            --work "$RUNNER_TEMP/shadow-build" --bundle "$RUNNER_TEMP/build.age"
      - name: Retain encrypted results
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shadow-${{ needs.request.outputs.request_id }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/build.age
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Return a Unity serial and stop the editor
        if: always()
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          if docker inspect haiven-unity >/dev/null 2>&1; then
            if [[ -n "$UNITY_SERIAL" ]]; then
              docker exec --env UNITY_EMAIL --env UNITY_PASSWORD haiven-unity sh -c \
                'unity-editor -batchmode -nographics -quit -logFile /tmp/return.log -returnlicense \
                  -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"' \
                || echo "::warning::Return the Unity serial seat by hand."
            fi
            docker rm --force haiven-unity >/dev/null
          fi
          sudo rm -rf source
